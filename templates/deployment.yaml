apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remnawave-subscription-page.fullname" . }}
  labels:
    {{- include "remnawave-subscription-page.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "remnawave-subscription-page.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $metricsAnnotations := and .Values.internal.enabled .Values.metrics.enabled .Values.metrics.podAnnotations }}
      {{- if or .Values.podAnnotations $metricsAnnotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $metricsAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.internal.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "remnawave-subscription-page.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "remnawave-subscription-page.fullname" . }}
            - secretRef:
                name: {{ if .Values.app.existingSecret }}{{ .Values.app.existingSecret }}{{ else }}{{ include "remnawave-subscription-page.fullname" . }}{{ end }}
          env:
            - name: REMNAWAVE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.existingSecret }}{{ .Values.app.existingSecret }}{{ else }}{{ include "remnawave-subscription-page.fullname" . }}{{ end }}
                  key: {{ .Values.app.apiTokenKey | default "apiToken" }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
            {{- if .Values.internal.enabled }}
            - name: {{ if .Values.metrics.enabled }}metrics{{ else }}internal{{ end }}
              containerPort: {{ .Values.internal.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- if .Values.internal.enabled }}
            httpGet:
              path: /healthz
              port: {{ .Values.internal.port }}
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- if .Values.internal.enabled }}
            httpGet:
              path: /readyz
              port: {{ .Values.internal.port }}
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
