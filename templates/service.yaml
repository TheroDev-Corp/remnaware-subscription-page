apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnawave-subscription-page.fullname" . }}
  labels:
    {{- include "remnawave-subscription-page.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and .Values.internal.enabled .Values.metrics.enabled }}
    - port: {{ .Values.internal.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "remnawave-subscription-page.selectorLabels" . | nindent 4 }}
