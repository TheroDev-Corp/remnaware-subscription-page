replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: remnawave/subscription-page
  pullPolicy: IfNotPresent
  tag: "7.2.6"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# Internal listener for health checks and metrics.
# Only the Go backend (backend-go) has it; the upstream TS image does not,
# so keep this disabled when running remnawave/subscription-page.
internal:
  enabled: false
  port: 3011

probes:
  # With internal.enabled, probes use httpGet /healthz and /readyz on the
  # internal port. Otherwise they fall back to tcpSocket on the app port.
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

metrics:
  # Requires internal.enabled. Exposes a "metrics" container/service port and
  # adds prometheus.io/* pod annotations for annotation-based scrapers.
  enabled: false
  path: /metrics
  podAnnotations: true

service:
  type: ClusterIP
  port: 3010

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: subscription.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Application specific configuration
app:
  port: 3010
  panelUrl: "https://panel.example.com"
  # Replace with your actual token or use an existing secret
  apiToken: "API_TOKEN_FROM_REMNAWAVE"
  # Alternatively, reference an existing secret
  existingSecret: ""
  # Key inside the existing secret for the API token. Default is 'apiToken'.
  apiTokenKey: "apiToken"

  # Optional: Serve at custom root path (e.g., 'sub'). Do not place / at start/end.
  customSubPrefix: ""
  # Optional: Support Marzban legacy links
  marzbanLegacyLinkEnabled: false
  marzbanLegacySecretKey: ""
  # Optional: Caddy auth API token if using 'Caddy with security' addon
  caddyAuthApiToken: ""
  # Optional: Cloudflare Zero Trust bypass
  cloudflareZeroTrustClientId: ""
  cloudflareZeroTrustClientSecret: ""
